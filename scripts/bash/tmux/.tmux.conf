#
# @file .tmux.conf
#
# @brief
# RC file to set up tmux, styled after our GNU screen config
# (see ../screen/.screenrc). Screen-style prefix and key parity
# where it makes sense; tmux idioms everywhere else.
#
# @changelog
# 2026/08/23 - Original version
#
# @author nisraina
# @date 2026/08/23
#
#

# Screen-style prefix: Ctrl-a instead of tmux's default Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# Ctrl-a Ctrl-a jumps to the previously active window, like screen
bind C-a last-window

# Turn that annoying visual bell off (screen: vbell off)
set -g visual-bell off
set -g bell-action none

# need more scroll (screen: defscrollback 100000)
set -g history-limit 100000

# don't display the startup message (screen: startup_message off)
set -g display-time 1000

# detach on hangup is automatic in tmux (screen: autodetach on)

# hardstatus/caption equivalent: screen-style status line
set -g status on
set -g status-interval 5
set -g status-style bg=black,fg=white
set -g status-left "[#S] "
set -g status-left-length 20
set -g window-status-format " #I:#W "
set -g window-status-current-style bg=white,fg=black,bold
set -g window-status-current-format " #I:#W "
set -g status-right "#(whoami)@#H  %d %b %Y, %H:%M "

# utf-8 is handled automatically by tmux >= 2.2 (screen: defutf8 on / utf8 on)

# 256-color support
set -g default-terminal "screen-256color"

# mouse support for pane select/resize/scroll (no screen equivalent, but handy)
set -g mouse on

# Screen key-parity bindings
bind A command-prompt "rename-window %%"                                  # screen: C-a A
bind k confirm-before -p "kill-window #W? (y/n)" kill-window              # screen: C-a k
bind K confirm-before -p "kill-session #S? (y/n)" kill-session
bind Escape copy-mode                                                     # screen: C-a Esc
